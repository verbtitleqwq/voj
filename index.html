<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>免费资源导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f7fa; color: #1f2937; padding: 40px 20px; min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #111827; }
  .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
  .search-box {
    width: 100%; padding: 14px 18px; font-size: 15px;
    border: 1px solid #e5e7eb; border-radius: 12px; outline: none;
    background: #fff; margin-bottom: 32px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
  .category { margin-bottom: 36px; }
  .category h2 {
    font-size: 18px; font-weight: 600; margin-bottom: 14px;
    padding-left: 10px; border-left: 4px solid #6366f1; color: #374151;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
    padding: 18px; text-decoration: none; color: inherit;
    transition: transform .15s, box-shadow .15s, border-color .15s; display: block;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.07); border-color: #c7d2fe; }
  .card .name { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: #111827; }
  .card .desc { font-size: 13px; color: #6b7280; line-height: 1.5; }
  .card .url { display: block; margin-top: 8px; font-size: 12px; color: #9ca3af; word-break: break-all; }
  .empty { text-align: center; color: #9ca3af; padding: 40px 0; font-size: 14px; display: none; }
  footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div class="container">
  <h1>免费资源导航</h1>
  <p class="subtitle">资源型 · 聚合型 · 工具型，一个页面搞定</p>

  <input class="search-box" type="text" id="search" placeholder="搜索名称、描述或网址…">

  <div id="list"></div>
  <div class="empty" id="empty">没有找到匹配的内容</div>
  <footer>持续整理中 · 资源均来自网络，请自行甄别</footer>
</div>

<script>
const data = [
  {
    category: "综合资源型 · 网址带资源文件",
    items: [
      { name: "尔尔资源", url: "https://erer.site", desc: "虚拟资源库，很多付费资源无偿分享，页面干净无广告。" },
      { name: "吾爱资源网", url: "#", desc: "整合百度、阿里、夸克、迅雷等网盘资源，覆盖影视、软件、学习资料。" },
      { name: "豆瓣分享帖", url: "https://www.douban.com", desc: "网友直接发网盘链接含提取码，覆盖 PPT 模板、考研、电子书合集等。" }
    ]
  },
  {
    category: "网址聚合型 · 网址带导航分类",
    items: [
      { name: "FMHY", url: "https://fmhy.net", desc: "被称为免费资源大全，分类涵盖影视、音乐、软件、AI 工具、电子书、游戏。" },
      { name: "科鱼社", url: "https://keyushe.com", desc: "优质网址聚合导航，整理免费小说、影视、生活服务等各类工具。" },
      { name: "虫部落快搜", url: "https://search.chongbuluo.com", desc: "搜索界瑞士军刀，聚合 Google、百度及学术、资源等垂直搜索。" }
    ]
  },
  {
    category: "实用工具型 · 网址带在线功能",
    items: [
      { name: "TinyWow", url: "https://tinywow.com", desc: "150 多种功能，PDF 压缩、格式转换、去水印、图片处理，不限次数。" },
      { name: "Photopea", url: "https://photopea.com", desc: "网页版 Photoshop，支持 PSD 等格式，临时改图不用开大型软件。" },
      { name: "iLovePDF", url: "https://ilovepdf.com", desc: "PDF 处理平台，免费版核心功能全开，不登录也能用。" }
    ]
  }
];

const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
const emptyEl = document.getElementById("empty");

function render(keyword = "") {
  const kw = keyword.trim().toLowerCase();
  let html = "", hasResult = false;

  data.forEach(group => {
    const matched = group.items.filter(item =>
      item.name.toLowerCase().includes(kw) ||
      item.desc.toLowerCase().includes(kw) ||
      item.url.toLowerCase().includes(kw)
    );
    if (matched.length === 0) return;
    hasResult = true;

    html += `<div class="category"><h2>${group.category}</h2><div class="cards">`;
    matched.forEach(item => {
      html += `
        <a class="card" href="${item.url}" target="_blank" rel="noopener">
          <div class="name">${item.name}</div>
          <div class="desc">${item.desc}</div>
          <span class="url">${item.url}</span>
        </a>`;
    });
    html += `</div></div>`;
  });

  listEl.innerHTML = html;
  emptyEl.style.display = hasResult ? "none" : "block";
}

searchEl.addEventListener("input", e => render(e.target.value));
render();
</script>
</body>
</html>
